<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933">Benchmark — token cost per review</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#5b6470">OpenCodeReview uses &#8776;1/9 of the tokens of a general-purpose agent</text>

  <!-- Donut -->
  <g transform="translate(200,205)">
    <!-- Background ring: general-purpose agent share -->
    <circle r="95" fill="none" stroke="#d9dee4" stroke-width="42"/>
    <!-- OCR arc: ~1/9 of circumference = 40deg, starting at top -->
    <circle r="95" fill="none" stroke="#2e9e63" stroke-width="42"
            stroke-dasharray="66.5 530.9" stroke-dashoffset="0"
            transform="rotate(-90)"/>
    <circle r="95" fill="none" stroke="#2e9e63" stroke-width="0" />
    <text y="-8" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">&#8776;1/9</text>
    <text y="14" text-anchor="middle" font-size="12" fill="#5b6470">of the tokens</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#3f4954">
    <rect x="360" y="112" width="14" height="14" rx="3" fill="#2e9e63"/>
    <text x="384" y="124" font-weight="600">OpenCodeReview</text>
    <text x="384" y="142" font-size="12" fill="#5b6470">same underlying model, engineered pipeline</text>

    <rect x="360" y="162" width="14" height="14" rx="3" fill="#d9dee4"/>
    <text x="384" y="174" font-weight="600">General-purpose agent</text>
    <text x="384" y="192" font-size="12" fill="#5b6470">baseline token consumption</text>
  </g>

  <!-- Metric table -->
  <g font-size="12.5">
    <rect x="360" y="216" width="360" height="118" rx="8" fill="#f7f9fb" stroke="#dde3e9"/>
    <text x="376" y="238" font-weight="700" fill="#3f4954">Metric</text>
    <text x="520" y="238" font-weight="700" fill="#3f4954">OpenCodeReview</text>
    <text x="632" y="238" font-weight="700" fill="#3f4954">GP agent</text>
    <line x1="372" y1="246" x2="708" y2="246" stroke="#dde3e9"/>
    <text x="376" y="266" fill="#3f4954">Precision</text><text x="528" y="266" font-weight="700" fill="#2e9e63">High</text><text x="640" y="266" fill="#8b95a1">Lower</text>
    <text x="376" y="286" fill="#3f4954">F1</text><text x="528" y="286" font-weight="700" fill="#2e9e63">High</text><text x="640" y="286" fill="#8b95a1">Lower</text>
    <text x="376" y="306" fill="#3f4954">Speed</text><text x="528" y="306" font-weight="700" fill="#2e9e63">Faster</text><text x="640" y="306" fill="#8b95a1">Slower</text>
    <text x="376" y="326" fill="#3f4954">Tokens used</text><text x="528" y="326" font-weight="700" fill="#2e9e63">&#8776;1/9</text><text x="640" y="326" fill="#8b95a1">Baseline</text>
  </g>

  <text x="380" y="362" text-anchor="middle" font-size="10.5" fill="#8b95a1">AACR-Bench: 50 repos &#183; 200 PRs &#183; 10 languages &#183; 1,505 ground-truth issues</text>
</svg>
